# Training run configuration.
#
# Precedence (lowest to highest):
#   built-in defaults < this file < CLI flags (--lr 1e-4) < deep overrides
#
# Deep overrides use the dotted config path, e.g.:
#   --model.atom_emb_kwargs.padding_idx 0
#   --model.rbf_kwargs.cutoff_upper 6.0
#   --training.optimizer_kwargs.betas "[0.9, 0.999]"
#   --training.scheduler_class ReduceLROnPlateau

# Dataset layout: "molecular" (default) or "box".
#   molecular — per-frame MD *_ams.hdf5 files (e.g. data/data_Daniel/); nodes
#               are the atoms of each frame.
#   box       — box per-molecule files (data/data_box_pure/); nodes are the
#               atoms of one molecule, targets use short names (HOMO, S1, ...).
# To train on box data: point `data:` at those files, set `dataset: box`,
# keep `radius` at an ATOMIC scale (~4.5-6 A — NOT the COM-scale used by the
# diffusion runner), and pick a scalar target (HOMO, HOMO-1, LUMO, LUMO+1, EA,
# IP, S1, T1). CLI: --dataset box
dataset: box

# One or more HDF5 files (same layout, same target key).
data:
  - data/data_box_pure/2-TNATA.hdf5

# Target property key(s) within each HDF5 group. Use a single string for one
# property, or a list to train on several at once (the model outputs one value
# per target; loss/metrics average over all of them).
target: "HOMO"
# target: ["Positive VIP", "HOMO"]

# Radius-graph cutoff (Angstrom). REQUIRED — no default: every run must set it
# manually (here, or with --radius). This is the cutoff for building edges
# between atoms (radius_graph / radius_graph_pbc).
radius: 5.

# Keep the box HDF5 data resident in memory: load it once at dataset
# construction instead of re-reading the file on every __getitem__ / accessor
# call. Only affects `dataset: box` (BoxMolecularDataset /
# CombinedBoxMolecularDataset). CLI: --keep_in_memory.
keep_in_memory: true

# Optional surrounding-molecule context for `dataset: box` per-molecule
# training. When enabled, each sample's graph also contains the atoms of the
# query molecule's surrounding molecules; the model runs a per-molecule readout
# and the loss covers only the minibatch (query) molecules, so surrounding
# molecules are passed but never trained on. Enabling this auto-turns on
# `model.pbc_edge_features` (minimum-image edge displacements).
#   mode:   "radius" (default) | "knn" | "all"
#           radius — every molecule whose COM lies within `radius` Angstrom.
#           knn    — the `k` nearest molecules by COM distance.
#           all    — every other molecule in the box (large graphs!).
#   radius: 20.0   # COM-scale context cutoff for mode=radius
#   k: 8           # number of neighbours for mode=knn
# CLI: --context_mode / --context_radius / --context_k
context:
  mode: radius
  radius: 15.0
  # k: 6

# CUDA / hardware knobs.
cuda:
  # Use NVIDIA Tensor Cores for float32 matmuls (TF32) and silence the
  # "You are using a CUDA device (...) that has Tensor Cores" warning, which
  # otherwise nags on the first matmul. Trades a little float32 precision for
  # a large speedup on GPUs with Tensor Cores (RTX 20xx+). CLI: --tensor_cores.
  tensor_cores: true

model:
  hidden_dim: 64
  num_layers: 7
  # Attention heads (only used when conv_class is GATConv).
  heads: 8
  num_rbf: 32
  # Use geometric edge features (bond distances via RBF). For a single molecule
  # with near-identical frames, plain mean-pooled atom embeddings are almost the
  # same across samples, so the model cannot even overfit; edge distances are
  # what lets it distinguish frames and drive the training loss down.
  use_edge_features: true
  # Use PBC minimum-image edge displacements instead of raw cartesian ones.
  # Needed for inter-molecular context edges (they cross the periodic box);
  # auto-set to true when the top-level `context:` block is enabled.
  pbc_edge_features: true
  conv_class: GATConv
  # Extra kwargs for every conv layer (e.g. GATConv: {"concat": False}).
  conv_kwargs: {}
  # Deep kwargs passed to AtomTypeEmbedding (e.g. padding_idx).
  atom_emb_kwargs: {}
  # Deep kwargs passed to the RBF distance embedding (DistanceEmbedding): any of
  # cutoff_lower / cutoff_upper / num_rbf / rbf_class / cutoff_fn / trainable /
  # cutoff_fn_kwargs, e.g. {cutoff_upper: 5.0, rbf_class: ExpNormalRBF,
  #       cutoff_fn: PolynomialEnvelope, cutoff_fn_kwargs: {exponent: 7}}.
  # rbf_class selects the radial basis — a name from RBF_REGISTRY (GaussianRBF,
  # ExpNormalRBF, BesselRBF, ChebychevRBF; ExpNormalSmearing aliases
  # ExpNormalRBF) or a class/instance. cutoff_fn_kwargs are extra constructor
  # kwargs for the envelope (e.g. PolynomialEnvelope `exponent`). Explicit
  # cutoff keys here take precedence over the first-class cutoff_lower /
  # cutoff_upper / cutoff_fn / cutoff_fn_kwargs below.
  rbf_kwargs: {rbf_class: GaussianRBF}
  # First-class RBF distance-embedding cutoffs (used when use_edge_features is
  # true). cutoff_upper is optional — when omitted (null) it defaults to the
  # radius-graph cutoff (`radius`). cutoff_lower defaults to 0.0.
  cutoff_lower: 0.0
  cutoff_upper: null            # optional -> defaults to `radius`
  # Optional RBF cutoff envelope (name from ENVELOPE_REGISTRY: CosineEnvelope,
  # PolynomialEnvelope; or null to keep the RBF's own default).
  # model.rbf_kwargs.cutoff_fn overrides this; an explicit
  # rbf_kwargs.cutoff_fn: null disables the cutoff (multiply by 1).
  cutoff_fn: null
  # Extra constructor kwargs for the cutoff envelope (e.g. PolynomialEnvelope
  # `exponent`). model.rbf_kwargs.cutoff_fn_kwargs overrides this.
  cutoff_fn_kwargs: {}
  # Whether to wrap each conv layer in a Residual connection.
  use_residual: true
  # Normalization type applied inside the residual wrapper (first-class knob).
  # Choices (torch_geometric.nn.norm): Identity (default), LayerNorm, BatchNorm,
  # GraphNorm, InstanceNorm. Extra kwargs for the chosen class go in norm_kwargs
  # (e.g. {track_running_stats: false} for BatchNorm). Takes effect only when
  # use_residual is true; residual_kwargs.norm overrides this.
  norm: LayerNorm
  norm_kwargs: {}
  # Number of output values per graph (one per target property). Set
  # automatically from the number of `target` properties; override only for
  # setups not driven by the target list.
  # num_targets: 1
  # Options passed to the Residual wrapper (dropout, pre/post norm placement).
  residual_kwargs:
    # dropout: null
    pre_norm: true
    post_norm: false
  dropout: 0.001
  act: silu
  # Optional: node->graph aggregation. A single name ("MeanAggregation",
  # "SumAggregation", "MaxAggregation"), several combined — either a YAML list
  # or a "MeanAggregation+MaxAggregation" string (joined with MultiAggregation,
  # which concatenates their outputs) — or any other torch_geometric.nn.aggr
  # name (imported on demand, e.g. "AttentionalAggregation", "SoftmaxAggregation").
  global_aggr: MeanAggregation+MaxAggregation+VariancePreservingAggregation+StdAggregation
  # Architecture switch: "scalar" (default) builds ScalarMoleculeModel;
  # "hierarchical" builds the two-level atomistic + COM GNN
  # (HierarchicalMoleculeModel). Hierarchical training needs a per-node molecule
  # assignment (mol_number) — enable the top-level `context:` block — and
  # `dataset: box`. CLI: --model.arch hierarchical
  arch: hierarchical
  # Two-level (atomistic + COM) hierarchy knobs (used only when
  # model.arch: hierarchical; all are passed straight to the model). Each of
  # `num_hierarchical_layers` cycles runs the atomistic conv stack, pools atoms
  # into COM nodes (`com_aggregation`: mean | sum | attention), runs
  # `com_num_layers` COM message-passing layers on the COM–COM graph (built from
  # the molecular COM positions, `com_cutoff`), then broadcasts the molecular
  # representation back to the atoms via a learnable gated residual (`com_gated`).
  # With `atomistic_edges: intra` (default) the atomistic graph is restricted to
  # intra-molecular edges, so molecules do NOT exchange atoms — all
  # inter-molecular communication goes through the COM–COM graph
  # (`com_graph: radius` = COM neighbours within com_cutoff, or `all` = every
  # molecule of the sample, i.e. all molecules in a large vicinity).
  # num_hierarchical_layers: 1   # 0 disables the hierarchy (plain scalar model)
  atomistic_edges: intra       # intra (default) | all
  # com_graph: radius            # radius (default, within com_cutoff) | all
  com_cutoff: 20.0             # COM–COM radius cutoff (Angstrom)
  # com_aggregation: mean        # mean | sum | attention
  # com_hidden_channels: null    # null -> hidden_dim
  # com_num_layers: 1            # COM message-passing layers per cycle
  # com_gated: true              # gated residual in the COM -> atom step

training:
  batch_size: 1
  lr: 0.001
  weight_decay: 0.0000001
  max_epochs: 1000
  patience: 50
  val_frac: 0.1
  test_frac: 0.1
  seed: 0
  num_workers: 8
  accelerator: auto
  # Optimizer / scheduler names from the runner registries.
  optimizer_class: AdamW
  optimizer_kwargs: {}
  scheduler_class: null          # e.g. ReduceLROnPlateau, StepLR, CosineAnnealingLR, OneCycleLR
  scheduler_kwargs: {}
  scheduler_monitor: val_loss
  scheduler_interval: epoch      # "epoch" or "step" (use "step" for OneCycleLR)
  # Free-form PyTorch Lightning Trainer kwargs (anything pl.Trainer accepts),
  # e.g. accumulate_grad_batches, precision, overfit_batches,
  # limit_train_batches, num_sanity_val_steps... Passed straight to
  # pl.Trainer(**trainer_kwargs(training)). CLI deep overrides work per key:
  #   --training.trainer_kwargs.accumulate_grad_batches 4
  trainer_kwargs: {accumulate_grad_batches: 4}
  # Gradient clipping (PyTorch Lightning Trainer kwargs). These are folded into
  # `trainer_kwargs` at Trainer build time, so the equivalent keys can also be
  # set there (which takes precedence). Set gradient_clip_val to a positive
  # number (e.g. 1.0) to enable; 0 or null disables it.
  # gradient_clip_algorithm: "norm" (default, clip by global gradient norm) or
  # "value" (clip each gradient by value). CLI: --gradient_clip_val 1.0
  gradient_clip_val: 4
  gradient_clip_algorithm: norm
  # Cross-validation: set k_folds > 1 to run K-fold CV instead of the single
  # train/val/test split. With several distinct molecules a Group K-fold keeps
  # whole molecules in the same fold (no train/val leakage); with a single
  # molecule a repeated shuffled K-fold runs n_repeats passes. 1 / null keeps
  # the current single split.
  k_folds: null
  n_repeats: 3
  # Standardize the target(s) (per-target mean/std fit on the training split)
  # before computing the loss; predictions are un-standardized for reporting.
  # Recommended for near-constant or large-magnitude targets (avoids a
  # systematic prediction offset). Set to false to train on raw targets.
  normalize_targets: true
  # Optional extra regression metrics to log: {name: metric_name}.
  # Metric names: mse_loss, l1_loss, smooth_l1_loss, mae, rmse, r2.
  # R² is also logged by default during training (train_r2/val_r2/test_r2) and
  # reported per split at the end of every run.
  # extra_metrics: {mae: l1_loss, rmse: mse_loss, r2: r2}

profiling:
  kind: null

logging:
  outdir: runs/artifacts
  # Set to a W&B project name to enable W&B logging. When enabled, the run gets
  # a human-friendly auto-generated name from the hyperparameters (see
  # run_training._make_run_name); override it with `run_name` below.
  wandb_project: Test
  # Optional W&B niceties:
  run_name: null             # e.g. "gat-h256-l4-r6.0" (auto if null)
  group: HOMO                       # group related runs together in the W&B UI
  tags: null                 # e.g. [baseline, gat]  (list)
  notes: null                # free-text description shown on the run page
  # Stdlib logging for the library + CLI (morphology_gnn._logging.configure_logging).
  # level: WARNING (silent) | INFO (default) | DEBUG (verbose) | ERROR.
  level: INFO
  # Optional path to also write logs to a file (e.g. runs/artifacts/train.log).
  log_file: null
