# Example Optuna search space for `runs/optimize.py`.
#
# Pass with:  conda run -n torch python runs/optimize.py --search-space runs/search_space.yaml
#
# Every key is a dotted config path (same syntax as run_training.py deep
# overrides). Supported sampling types:
#   categorical: {type: categorical, choices: [...]}
#   int:         {type: int, low: ..., high: ..., step: ...}
#   float:       {type: float, low: ..., high: ..., step: ...}
#   log_float:   {type: log_float, low: ..., high: ...}
#   log_int:     {type: log_int, low: ..., high: ...}
#
# Omit a key to keep that option fixed at its value from the base config.

model.hidden_dim:
  type: categorical
  choices: [16, 32, 64, 128]

model.num_layers:
  type: int
  low: 1
  high: 8

model.heads:
  type: categorical
  choices: [1, 2, 4, 8, 16]

model.num_rbf:
  type: categorical
  choices: [16, 32, 64, 128]

model.rbf_kwargs.rbf_class:
  type: categorical
  choices: ["GaussianRBF", "ExpNormalRBF", "BesselRBF", "ChebychevRBF"]

# NOTE: use `null` (not `None`) to disable the cutoff. PyYAML parses bare `None`
# as the *string* 'None', which would crash the trial (unknown cutoff_fn); `null`
# becomes Python None and multiplies the RBF features by 1 (no cutoff).
model.rbf_kwargs.cutoff_fn:
  type: categorical
  choices: ["CosineEnvelope", "PolynomialEnvelope", null]

model.dropout:
  type: log_float
  low: 0.0001
  high: 0.5

model.act:
  type: categorical
  choices: ["gelu", "mish", "relu", "silu"]

model.conv_class:
  type: categorical
  choices: ["GATConv", "GATv2Conv"]

# model.use_edge_features:
#   type: categorical
#   choices: [false, true]

training.lr:
  type: log_float
  low: 0.00001
  high: 0.01

training.batch_size:
  type: categorical
  choices: [4, 8, 16, 32]

training.weight_decay:
  type: log_float
  low: 0.0000001
  high: 0.001

# training.optimizer_class:
#   type: categorical
#   choices: ["Adam", "AdamW"]

radius:
  type: float
  low: 2.
  high: 5.

# Optional normalization search space (uncomment to tune). `model.norm` is the
# first-class knob (applied inside the residual wrapper).
model.norm:
  type: categorical
  choices: ["Identity", "LayerNorm", "BatchNorm", "GraphNorm", "InstanceNorm"]
# model.use_residual:
#   type: categorical
#   choices: [true, false]
