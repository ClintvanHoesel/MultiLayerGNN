# Diffusion position-generator configuration (box "morphology" mode).
#
# Trains an EGNN-style SE(3)-equivariant denoiser (epsilon-prediction periodic
# variance-exploding diffusion) on
# molecule center-of-mass positions: each sample is one periodic box of
# N molecules, and the model learns to denoise / generate the N center-of-mass
# coordinates (molecules/position) conditioned on the molecule species + cell —
# i.e. the molecular packing of the box.
#
# Precedence (lowest to highest):
#   built-in defaults < this file < CLI flags (--lr 1e-4) < deep overrides
#
# Deep overrides use the dotted config path, e.g.:
#   --model.hidden_dim 256
#   --diffusion.schedule linear
#   --sampling.steps 50 --sampling.ddim true

# Dataset layout: "box" (boxes of molecules, COM positions; one sample per
# box) or "box_zordered" (per-molecule z-ordered samples: the studied molecule
# + everything at/below its z with a target_mask, so the train/val/test split
# draws random molecules across the film) or "molecular" (per-frame MD
# *_ams.hdf5, per-atom positions).
dataset: box_zordered

# One or more box HDF5 files (one periodic box per file).
data:
  - data/data_box_pure/BCP.hdf5

# Target property key(s) within each HDF5 group. UNUSED by the diffusion model
# (no property conditioning); the box dataset is built with target_key=None.
target: null

# Radius-graph cutoff (Angstrom) for the PBC neighbor list. REQUIRED — no
# default: every run must set it manually (here, or with --radius).
# NOTE: in box mode the graph connects molecule CENTERS, so use a COM-scale
# cutoff (molecule separation, e.g. 15-25 A), NOT the ~4 A atomic value.
radius: 20.0

# Keep the box HDF5 data resident in memory: load it once at dataset
# construction instead of re-reading the file on every accessor call. Affects
# `dataset: box` / `dataset: box_zordered`. CLI: --keep_in_memory.
keep_in_memory: true

# CUDA / hardware knobs.
cuda:
  # Use NVIDIA Tensor Cores for float32 matmuls (TF32) and silence the
  # "You are using a CUDA device (...) that has Tensor Cores" warning, which
  # otherwise nags on the first matmul. Trades a little float32 precision for
  # a large speedup on GPUs with Tensor Cores (RTX 20xx+). CLI: --tensor_cores.
  tensor_cores: true

model:
  hidden_dim: 128
  num_layers: 2
  # Attention heads (only used when conv_class is GATConv).
  heads: 4
  num_rbf: 64
  # The message-passing backbone must accept an `edge_dim` argument (GATConv,
  # TransformerConv, ...); it consumes the RBF min-image edge features.
  conv_class: GATConv
  conv_kwargs: {}
  # Deep kwargs passed to the RBF distance embedding, e.g. {rbf_class:
  # ExpNormalRBF, cutoff_fn: PolynomialEnvelope, cutoff_fn_kwargs: {exponent: 7}}.
  # cutoff_upper defaults to `radius` when omitted. cutoff_fn_kwargs are extra
  # constructor kwargs for the envelope (e.g. PolynomialEnvelope `exponent`).
  rbf_kwargs: {}
  cutoff_lower: 0.0
  cutoff_upper: null            # optional -> defaults to `radius`
  # Optional RBF cutoff envelope (name from ENVELOPE_REGISTRY: CosineEnvelope,
  # PolynomialEnvelope; or null to keep the RBF's own default).
  # model.rbf_kwargs.cutoff_fn overrides this; an explicit
  # rbf_kwargs.cutoff_fn: null disables the cutoff (multiply by 1).
  cutoff_fn: null
  # Extra constructor kwargs for the cutoff envelope (e.g. PolynomialEnvelope
  # `exponent`). model.rbf_kwargs.cutoff_fn_kwargs overrides this.
  cutoff_fn_kwargs: {}
  # Whether to wrap each conv layer in a Residual connection.
  use_residual: true
  # Normalization type inside the residual wrapper (names from the residual
  # NORM_REGISTRY): identity/layernorm/batchnorm/graphnorm/instancenorm.
  norm: null
  norm_kwargs: {}
  # Width of the MLP that embeds the (3,) box lengths into node features.
  cell_embed_dim: 16
  # Whether the noise head includes an isotropic per-atom term (zero-initialized).
  self_term: true

diffusion:
  # Noise schedule for the forward process: cosine (default) or linear.
  schedule: cosine
  # Forward-noise amplitude (Angstrom) at sigma=1. null keeps the per-graph box
  # (cell-scaled noise). A scalar sets the same scale in x/y/z; a length-3 list
  # sets per-axis scales [x, y, z] — set z much smaller than x/y to keep the
  # thin-film thickness stable during diffusion.
  noise_scale: null

training:
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.0
  max_epochs: 200
  patience: 30
  # With only a few boxes per dataset the fractional split can produce empty
  # val/test loaders (guarded in the runner; generation then runs on all boxes).
  val_frac: 0.1
  test_frac: 0.1
  seed: 0
  num_workers: 4
  accelerator: auto
  optimizer_class: Adam
  optimizer_kwargs: {}
  scheduler_class: null
  scheduler_kwargs: {}
  scheduler_monitor: val_loss
  scheduler_interval: epoch
  # Sequential (+z) training: the studied (target) molecule of each sample is
  # noised while the molecules below it (context) stay clean, with the loss over
  # the target. null = auto: true for dataset=box_zordered (per-molecule samples
  # with a target_mask); false keeps the original whole-box corruption.
  z_ordered: null
  # How many molecules are learned and sampled at a time in sequential (+z)
  # mode. 1 = original point-by-point; K > 1 learns and generates a contiguous
  # z-block of K molecules per step. The z-ordered dataset (box_zordered)
  # marks the target block in its per-sample target_mask; the sampler
  # reverse-diffuses K points together per step.
  chunk_size: 1

sampling:
  # Number of reverse-diffusion steps used when generating structures.
  steps: 100
  # Deterministic DDIM-style VE sampling instead of the stochastic ancestral update.
  ddim: false
  # DDIM stochasticity (only when ddim is true; 0 = fully deterministic).
  eta: 0.0
  # How many new conformations to generate per reference frame (end of run).
  num_samples: 8
  # How many reference frames per split to condition generation on.
  num_reference: 4
  seed: 0

# Generation strategy. mode "full" keeps the original whole-structure sampler
# (all molecules reverse-diffused simultaneously). mode "sequential_z" generates
# the molecules point-by-point in +z: each new molecule is reverse-diffused with
# the structure-so-far frozen in the graph as context, and its COM z is
# constrained to stay at/above the current z-frontier at every sampling step.
# dataset=box_zordered trains the sequential conditional model, so it pairs
# with generation.mode=sequential_z (the runner warns otherwise).
generation:
  mode: sequential_z
  # Number of molecules to generate sequentially (default: the reference
  # molecule count, so the generated shape matches the truth for metrics).
  num_points: null
  # Minimum z (Angstrom) below which no molecule is generated — the excluded
  # bottom layer. Always: generated_z >= bottom_z_exclusion.
  bottom_z_exclusion: 0.0
  # Optional minimum z separation between consecutive molecules (0 = the model
  # freely chooses the spacing, constrained only to stay at/above the current
  # z-frontier).
  z_step: 0.0

logging:
  outdir: runs/artifacts_diffusion
  wandb_project: diffusion
  run_name: null
  group: null
  tags: null
  notes: null
  # Stdlib logging: WARNING (silent) / INFO (default) / DEBUG (verbose).
  level: INFO
  log_file: null
