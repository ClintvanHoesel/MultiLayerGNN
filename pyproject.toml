[tool.poetry]
name = "morphology_gnn"
version = "0.1.0"
description = "GNN for molecular property prediction in morphology."
authors = ["clint <clint@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.0.1"
torch-geometric = "^1.5.0"
pandas = "^1.5.3"
scipy = "^1.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
